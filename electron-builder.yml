appId: com.financeiro.pessoal
productName: Financeiro Pessoal
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - node_modules/better-sqlite3/**/*
asarUnpack:
  - "**/*.node"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Financeiro Pessoal
